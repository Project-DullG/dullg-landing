<svg xmlns="http://www.w3.org/2000/svg" width="58mm" height="90mm" viewBox="0 0 348 540"><rect width="348" height="540" rx="12" fill="#f7f1e4"/><g font-family="Nanum Gothic, Arial, sans-serif"><rect width="348" height="540" rx="12" fill="#8b743f"/><rect x="12" y="12" width="324" height="516" rx="6" fill="none" stroke="#decda3" stroke-width="1"/><text x="174" y="62" font-size="20" fill="#f7f1e4" text-anchor="middle" letter-spacing="4"><tspan x="174" dy="0">울릉마블</tspan></text><path d="M116 124L142 98L165 117L192 80L232 124M114 139Q144 127 174 139T234 139" fill="none" stroke="#efe4c9" stroke-width="2"/><text x="174" y="195" font-size="32" fill="#f7f1e4" text-anchor="middle" font-family="Nanum Myeongjo, Georgia, serif"><tspan x="174" dy="0">일주</tspan></text><text x="174" y="238" font-size="15" fill="#eee0ba" text-anchor="middle" font-weight="bold"><tspan x="174" dy="0">획득 조건</tspan></text><text x="174" y="273" font-size="14.5" fill="#f7f1e4" text-anchor="middle"><tspan x="174" dy="0">다섯 권역에서 각각 이동을 마치고,</tspan><tspan x="174" dy="24">사동항·도동항·저동항 중</tspan><tspan x="174" dy="24">한 곳에 도착하면 가져갑니다.</tspan></text><text x="174" y="356" font-size="12.5" fill="#eee3c7" text-anchor="middle"><tspan x="174" dy="0">출발·통과는 방문으로 세지 않습니다.</tspan><tspan x="174" dy="23">방문 기록은 게임이 끝날 때까지 유지합니다.</tspan></text><path d="M35 403H313" stroke="#d6c397"/><text x="174" y="440" font-size="24" fill="#f7f1e4" text-anchor="middle" font-weight="bold"><tspan x="174" dy="0">+1장 획득 · 7점</tspan></text><text x="174" y="480" font-size="12.5" fill="#f7f1e4" text-anchor="middle"><tspan x="174" dy="0">1인 1회 · 총 4장</tspan><tspan x="174" dy="23">먼저 조건을 채운 4명만 받습니다.</tspan></text></g></svg>