ass="design-head"><div><img src="assets/emblem.svg" alt=""><span><h1>울릉마블 · 스피드 레이싱</h1><p>지도와 카드</p></span></div><nav><a href="table.html">테이블 모드</a><a href="cards.html">전체 카드</a><a href="print.html">인쇄하기 ↗</a></nav></header><div class="design-samples" id="design-samples"></div><div class="design-note"><span>이벤트 20장과 아이템 20장 · 개인 카드 54장</span><span>3–6명 · 비밀 베팅 레이스</span></div><div class="design-map"><h2>울릉도를 돌아 독도까지</h2><a href="board-art.html"><img src="board.svg?v=20261020-readable" alt="사동항에서 출발해 울릉도를 일주하고 독도에서 끝나는 경주 지도"></a></div><div class="design-backs" id="design-backs"></div></main><script type="module">import{cardHTML,backHTML}from'./view.mjs?v=20261021-readable3';import{EVENTS,ITEMS,BETS}from'./cards.mjs';const r=await fetch('racers.json').then(r=>r.json());document.querySelector('#design-samples').innerHTML=[EVENTS[2],ITEMS[0],{...r[0],kind:'horse'},{...BETS[0],kind:'bet'}].map(c=>'<div>'+cardHTML(c)+'</div>').join('');document.querySelector('#design-backs').innerHTML=['여행 이벤트','여행 아이템','비밀 베팅'].map(s=>'<div>'+backHTML(s)+'</div>').join('');</script></body></html>
